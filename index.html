<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2550">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Glass Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: painted landscape behind floor-to-ceiling windows; frosted top pill nav, floating left icon rail, one big glass board of coloured project cards */
:root {
  --ink: #ffffff;
  --ink-2: rgba(255,255,255,.72);
  --ink-3: rgba(255,255,255,.5);
  --glass: rgba(22,18,44,.26);
  --glass-2: rgba(255,255,255,.14);
  --edge: rgba(255,255,255,.22);
  --accent: #3d8bff;
  --own: #5b8def;      /* Η εταιρία μου */
  --partner: #d9a441;  /* Συνεργαζόμενη εταιρία */
  --home: #4fbf7f;     /* Hobbies & Σπίτι */
  --font: "Commissioner", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #1b2550; color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4; overflow-x: hidden; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
.bgimg { position: fixed; inset: 0; z-index: 0; background-size: cover; background-position: center; }

.glass {
  background: var(--glass);
  border: 1px solid var(--edge);
  backdrop-filter: blur(22px) saturate(150%);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  box-shadow: 0 12px 40px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.18);
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Top bar */
.top { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 14px calc(18px + env(safe-area-inset-left)); }
.ibtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; position: relative; }
.ibtn:hover { background: rgba(255,255,255,.22); }
.group { display: flex; gap: 8px; align-items: center; }
.nav { display: flex; gap: 6px; padding: 5px; border-radius: 999px; }
.nav button { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; border: 0; background: transparent; cursor: pointer; color: var(--ink-2); font-weight: 500; }
.nav button:hover { color: #fff; background: rgba(255,255,255,.1); }
.nav button[aria-current="page"] { background: rgba(255,255,255,.2); color: #fff; }
.badge { position: absolute; top: 4px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: #ff5a5f; border: 1.5px solid rgba(0,0,0,.3); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #f0a35e, #d2693c); display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 2px solid rgba(255,255,255,.5); }
@media (max-width: 820px) { .nav .lbl { display: none; } .top .hide-sm { display: none; } }

/* Shell */
.shell { position: relative; z-index: 1; display: grid; grid-template-columns: 56px 1fr; gap: 16px; padding: 4px 18px 28px; max-width: 1480px; margin: 0 auto; }
.rail { z-index: 3; align-self: center; position: sticky; top: 30vh; display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 999px; }
.rail button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); position: relative; }
.rail button:hover { background: rgba(255,255,255,.14); color: #fff; }
.rail button[aria-pressed="true"] { background: #fff; color: #2a2420; }
.rail button .tip { position: absolute; left: 50px; white-space: nowrap; font-size: 12px; padding: 4px 9px; border-radius: 8px; background: rgba(20,18,16,.75); color: #fff; opacity: 0; pointer-events: none; transition: opacity .15s; }
.rail button:hover .tip, .rail button:focus-visible .tip { opacity: 1; }
@media (max-width: 700px) { .shell { grid-template-columns: 1fr; } .rail { position: static; flex-direction: row; justify-content: center; border-radius: 999px; align-self: stretch; } .rail button .tip { display: none; } }

.board { background: rgba(255,255,255,.06); backdrop-filter: blur(8px) saturate(140%); -webkit-backdrop-filter: blur(8px) saturate(140%); border-radius: 28px; padding: 22px 22px 26px; min-width: 0; }
.board-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
.board-head h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.board-head p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 11px !important; color: var(--ink-3) !important; margin-top: 4px !important; }
.sync i { width: 7px; height: 7px; border-radius: 50%; }
.tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: flex; gap: 3px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid var(--edge); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; cursor: pointer; color: var(--ink-2); font-size: 13px; font-weight: 500; display: inline-flex; gap: 7px; align-items: center; }
.seg button:hover { color: #fff; }
.seg button[aria-pressed="true"] { background: #fff; color: #2a2420; }
.seg .dot { width: 8px; height: 8px; border-radius: 50%; }
.primary { border: 0; background: var(--accent); color: #fff; padding: 9px 16px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-weight: 600; font-size: 13px; box-shadow: 0 6px 18px rgba(61,139,255,.4); }
.primary:hover { filter: brightness(1.08); }

.subbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 14px 0 18px; }
.search { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid var(--edge); color: var(--ink-2); }
.search input { border: 0; background: transparent; color: #fff; font: inherit; padding: 8px 0; width: 190px; outline: none; }
.search input::placeholder { color: var(--ink-3); }
.mini { border: 1px solid var(--edge); background: rgba(255,255,255,.08); padding: 6px 12px; border-radius: 999px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.mini[aria-pressed="true"] { background: rgba(255,255,255,.85); color: #2a2420; border-color: transparent; }
.stats { margin-left: auto; display: flex; gap: 16px; color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.stats b { color: #fff; font-size: 15px; margin-right: 4px; }

/* Cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); gap: 16px; }
.card {
  --c: var(--own);
  border-radius: 20px; padding: 8px; display: flex; flex-direction: column; gap: 10px; text-align: left;
  background: rgba(20,16,40,.30); border: 1px solid var(--edge);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.14);
  transition: transform .18s ease, box-shadow .18s ease;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.2); }
@media (prefers-reduced-motion: reduce) { .card, .card:hover { transition: none; transform: none; } }
.card .hero {
  height: 96px; border-radius: 14px; position: relative; padding: 12px;
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 92%, #fff 8%), color-mix(in srgb, var(--c) 70%, #000 30%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
}
.card .hero svg.i { width: 20px; height: 20px; opacity: .92; }
.card .tag { position: absolute; right: 10px; bottom: 10px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.28); }
.card .st { position: absolute; right: 10px; top: 10px; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.22); display: inline-flex; gap: 5px; align-items: center; }
.card .st i { width: 6px; height: 6px; border-radius: 50%; }
.card .body { padding: 0 6px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.card h3 { margin: 0; font-size: 14px; font-weight: 600; text-wrap: balance; }
.card p { margin: 0; font-size: 12px; color: var(--ink-2); }
.prog { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.prog .track { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
.prog .track span { display: block; height: 100%; background: var(--c); border-radius: 2px; }
.card .foot { display: flex; align-items: center; gap: 4px; padding: 4px 6px 2px; font-size: 11px; color: var(--ink-3); border-top: 1px solid rgba(255,255,255,.1); padding-top: 8px; }
.card .foot .meta { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .foot button { border: 0; background: transparent; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.card .foot button:hover { background: rgba(255,255,255,.14); color: #fff; }
.card .foot button[aria-pressed="true"] { color: #ffd166; }
.card .foot button[aria-pressed="true"] svg { fill: currentColor; }
.card .due-late { color: #ff9a9a; }
.empty { grid-column: 1 / -1; padding: 40px 10px; text-align: center; color: var(--ink-2); }

/* Dialog */
.scrim { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.35); display: none; place-items: center; padding: 16px; }
.scrim.open { display: grid; }
.dlg { width: min(440px, 100%); border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 12px; background: rgba(22,18,44,.55); }
.dlg h2 { margin: 0 0 4px; font-size: 18px; }
.dlg label { font-size: 12px; color: var(--ink-2); display: flex; flex-direction: column; gap: 5px; }
.dlg input, .dlg select { font: inherit; color: #fff; background: rgba(255,255,255,.1); border: 1px solid var(--edge); border-radius: 12px; padding: 9px 11px; }
.dlg select option { background: #3a332e; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.ghost { border: 1px solid var(--edge); background: transparent; padding: 9px 16px; border-radius: 999px; cursor: pointer; }
body.locked header, body.locked .shell { display: none !important; }
body.locked #setup { background: transparent; }
.login-brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 4px; text-align: center; }
.login-brand img { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
body:not(.locked) .login-brand { display: none; }
body.locked .setup-extra { display: none; }
.hint { margin: 0; font-size: 13px; color: var(--ink-2); }
.hint.err { color: #ffb0b0; min-height: 1em; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 11; padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (max-width: 560px) { .top { padding: calc(10px + env(safe-area-inset-top)) 12px 10px; } .shell { padding: 4px 10px calc(20px + env(safe-area-inset-bottom)); } .board { padding: 16px 14px 18px; border-radius: 22px; } .board-head h1 { font-size: 22px; } .tools, .seg { width: 100%; } .seg { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } .seg button { flex: none; white-space: nowrap; } .primary { width: 100%; justify-content: center; } .search { flex: 1 1 100%; } .search input { width: 100%; } .stats { margin-left: 0; } .grid { grid-template-columns: 1fr 1fr; gap: 10px; } .card .hero { height: 72px; } }
@media (max-width: 560px) { .search input, .dlg input, .dlg select { font-size: 16px; } }
@media (max-width: 380px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="bgimg" id="bgimg" aria-hidden="true"></div>

<header class="top">
  <div class="group">
    <button class="ibtn glass hide-sm" type="button" id="btn-filters" aria-label="Φίλτρα"><svg class="i"><use href="#i-sliders"/></svg></button>
    <button class="ibtn glass" type="button" id="btn-bg" aria-label="Αλλαγή φόντου" title="Αλλαγή φόντου"><svg class="i"><use href="#i-image"/></svg></button>
    <input type="file" id="bgfile" accept="image/*" hidden>
  </div>
  <nav class="nav glass" aria-label="Κύριο μενού">
    <button type="button" data-view="home"><svg class="i"><use href="#i-home"/></svg><span class="lbl">Αρχική</span></button>
    <button type="button" data-view="projects" aria-current="page"><svg class="i"><use href="#i-folder"/></svg><span class="lbl">Έργα</span></button>
    <button type="button" data-view="goals"><svg class="i"><use href="#i-target"/></svg><span class="lbl">Στόχοι</span></button>
    <button type="button" data-view="settings"><svg class="i"><use href="#i-gear"/></svg><span class="lbl">Ρυθμίσεις</span></button>
  </nav>
  <div class="group">
    <button class="ibtn glass hide-sm" type="button" aria-label="Μηνύματα"><svg class="i"><use href="#i-mail"/></svg></button>
    <button class="ibtn glass" type="button" aria-label="Ειδοποιήσεις"><svg class="i"><use href="#i-bell"/></svg><span class="badge"></span></button>
    <div class="avatar" title="Φώτης">ΦΧ</div>
  </div>
</header>

<div class="shell">
  <aside class="rail glass" aria-label="Γρήγορες προβολές">
    <button type="button" data-quick="all" aria-pressed="true"><svg class="i"><use href="#i-grid"/></svg><span class="tip">Όλα τα έργα</span></button>
    <button type="button" data-quick="today"><svg class="i"><use href="#i-clock"/></svg><span class="tip">Λήγουν σύντομα</span></button>
    <button type="button" data-quick="late"><svg class="i"><use href="#i-alert"/></svg><span class="tip">Καθυστερημένα</span></button>
    <button type="button" data-quick="done"><svg class="i"><use href="#i-check"/></svg><span class="tip">Ολοκληρωμένα</span></button>
    <button type="button" data-quick="fav"><svg class="i"><use href="#i-heart"/></svg><span class="tip">Αγαπημένα</span></button>
  </aside>

  <main class="board glass">
    <div class="board-head">
      <div>
        <h1 id="title">Τα έργα μου</h1>
        <p id="subtitle"></p>
        <p class="sync" id="sync" role="status"></p>
      </div>
      <div class="tools">
        <div class="seg" id="cats" role="group" aria-label="Κατηγορία"></div>
        <button class="primary" type="button" id="add"><svg class="i"><use href="#i-plus"/></svg>Νέο έργο</button>
      </div>
    </div>

    <div class="subbar" id="subbar">
      <label class="search"><svg class="i"><use href="#i-search"/></svg><input type="search" id="q" placeholder="Αναζήτηση έργου…" aria-label="Αναζήτηση έργου"></label>
      <div class="group" id="status-f" role="group" aria-label="Κατάσταση"></div>
      <div class="stats" id="stats"></div>
    </div>

    <section class="grid" id="grid" aria-live="polite"></section>
  </main>
</div>

<div class="scrim" id="scrim">
  <form class="dlg glass" id="form" role="dialog" aria-modal="true" aria-labelledby="dlg-h">
    <h2 id="dlg-h">Νέο έργο</h2>
    <label for="f-title">Τίτλος<input id="f-title" required maxlength="60" placeholder="π.χ. Ανακαίνιση μπάνιου"></label>
    <label for="f-sub">Περιγραφή<input id="f-sub" maxlength="90" placeholder="Μια γραμμή για το τι αφορά"></label>
    <div class="row">
      <label for="f-cat">Κατηγορία<select id="f-cat"></select></label>
      <label for="f-due">Προθεσμία<input id="f-due" type="date"></label>
    </div>
    <div class="row">
      <label for="f-status">Κατάσταση<select id="f-status"></select></label>
      <label for="f-prog">Πρόοδος %<input id="f-prog" type="number" min="0" max="100" value="0"></label>
    </div>
    <div class="actions">
      <button type="button" class="ghost" id="cancel">Άκυρο</button>
      <button type="submit" class="primary">Προσθήκη</button>
    </div>
  </form>
</div>
<div class="scrim" id="setup">
  <form class="dlg glass" id="setup-form" aria-labelledby="setup-h">
    <div class="login-brand"><img src="icon-180.png" alt=""><h2 id="setup-h">Σύνδεση</h2></div>
    <h2 class="setup-extra">Ρυθμίσεις συγχρονισμού</h2>
    <label for="s-user">Όνομα χρήστη<input id="s-user" autocomplete="username" autocapitalize="off" spellcheck="false" ></label>
    <label for="s-token">Κωδικός<input id="s-token" type="password" autocomplete="current-password" ></label>
    <p class="hint err" id="s-err" role="alert"></p>
    <div class="actions">
      <button type="button" class="ghost" id="s-disconnect" hidden>Αποσύνδεση</button>
      <button type="button" class="ghost" id="s-close">Κλείσιμο</button>
      <button type="submit" class="primary">Σύνδεση</button>
    </div>
  </form>
</div>
<div class="toast glass" id="toast" role="status"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h0"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 12 5 5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M2 13h20"/></symbol>
  <symbol id="i-handshake" viewBox="0 0 24 24"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.9-3.9a3 3 0 0 0-4.2 0l-.9.9a1 1 0 1 1-3-3l2.8-2.8a5.8 5.8 0 0 1 7.1-.9l.5.3a3 3 0 0 0 2 .4H21"/><path d="m21 3 1 11h-2M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3M3 4h8"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z"/><path d="M2 21c0-3 1.9-5.4 5-6"/></symbol>
  <symbol id="i-check-sm" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
</svg>

<script>
// ===== Κατηγορίες (άλλαξε εδώ ονόματα / χρώματα) =====
const CATS = [
  { id: "own",     name: "Η εταιρία μου",          short: "Εταιρία",   color: "#5b8def", icon: "i-briefcase" },
  { id: "partner", name: "Συνεργαζόμενη εταιρία",  short: "Συνεργάτης", color: "#d9a441", icon: "i-handshake" },
  { id: "home",    name: "Hobbies & Σπίτι",        short: "Προσωπικά", color: "#4fbf7f", icon: "i-leaf" },
];
const STATUSES = [
  { id: "active", name: "Σε εξέλιξη",   dot: "#8fd3ff" },
  { id: "wait",   name: "Σε αναμονή",   dot: "#ffd166" },
  { id: "done",   name: "Ολοκληρώθηκε", dot: "#6fe39b" },
];
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const dayOffset = n => { const d = new Date(TODAY); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };

// Η εφαρμογή ξεκινάει άδεια: τα έργα έρχονται μόνο από το ιδιωτικό dashboard-data.

let projects = [];
let mode = "loading";
const CFG_KEY = "gd-github", CACHE_KEY = "gd-cache";
const DATA_REPO = "dashboard-data", DATA_FILE = "projects.json";
let cfg = null, sha = null, saveTimer = null, saving = false, dirty = false;
try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || "null"); } catch (e) {}

const b64enc = str => { const bytes = new TextEncoder().encode(str); let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));
const api = (path, opts = {}) => fetch(`https://api.github.com/repos/${cfg.user}/${DATA_REPO}/contents/${path}`, {
  ...opts, cache: "no-store",
  headers: { Authorization: `Bearer ${cfg.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) },
});

function setSync(st) {
  const el = document.getElementById("sync"); if (!el) return;
  const map = { loading: ["#ffd166", "Συγχρονισμός…"], cloud: ["#6fe39b", "Συγχρονισμένο"], saving: ["#8fd3ff", "Αποθήκευση…"], error: ["#ff7a8a", "Χωρίς σύνδεση: οι αλλαγές θα σταλούν μόλις συνδεθείς"], local: ["#ffd166", "Δεν έχει ρυθμιστεί ο συγχρονισμός"] };
  const [c, t] = map[st]; el.innerHTML = `<i style="background:${c}"></i>${t}`;
}
function cacheLocal() { try { localStorage.setItem(CACHE_KEY, JSON.stringify(projects)); } catch (e) {} }

async function pull() {
  if (!cfg || saving || dirty) return;
  setSync("loading");
  try {
    const r = await api(DATA_FILE);
    if (r.status === 404) { projects = []; sha = null; mode = "cloud"; setSync("cloud"); render(); return; }
    if (r.status === 401 || r.status === 403) { setSync("error"); toast("Ο κωδικός δεν δουλεύει. Έλεγξέ τον στις Ρυθμίσεις."); return; }
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    sha = j.sha;
    const v = JSON.parse(b64dec(j.content));
    projects = Array.isArray(v.projects) ? v.projects : [];
    mode = "cloud"; cacheLocal(); setSync("cloud"); render();
  } catch (e) { setSync("error"); }
}

async function push() {
  if (!cfg) return;
  saving = true; dirty = false; setSync("saving");
  const body = JSON.stringify({ updated: new Date().toISOString(), projects }, null, 1);
  try {
    let r = await api(DATA_FILE, { method: "PUT", body: JSON.stringify({ message: "Ενημέρωση έργων", content: b64enc(body), ...(sha ? { sha } : {}) }) });
    if (r.status === 409 || r.status === 422) {
      const cur = await api(DATA_FILE); if (cur.ok) sha = (await cur.json()).sha;
      r = await api(DATA_FILE, { method: "PUT", body: JSON.stringify({ message: "Ενημέρωση έργων", content: b64enc(body), ...(sha ? { sha } : {}) }) });
    }
    if (!r.ok) throw new Error(r.status);
    sha = (await r.json()).content.sha;
    setSync("cloud");
  } catch (e) { dirty = true; setSync("error"); }
  saving = false;
  if (dirty) { clearTimeout(saveTimer); saveTimer = setTimeout(push, 15000); }
}

const save = () => {
  cacheLocal();
  if (!cfg) return;
  dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(push, 600);
};

function lock(on) { document.body.classList.toggle("locked", on); }
function initCloud() {
  if (!cfg) { lock(true); mode = "local"; openSetup(true); return; }
  lock(false);
  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); if (Array.isArray(c)) { projects = c; render(); } } catch (e) {}
  pull();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pull(); });
  addEventListener("focus", pull);
  setInterval(() => { if (document.visibilityState === "visible") pull(); }, 60000);
}

// Οθόνη ρύθμισης (μία φορά ανά συσκευή)
function openSetup(first) {
  const s = $("#setup");
  $("#s-user").value = cfg?.user || "";
  $("#s-token").value = "";
  $("#s-err").textContent = "";
  $("#s-disconnect").hidden = !cfg;
  $("#s-close").hidden = first && !cfg;
  s.classList.add("open");
  setTimeout(() => (cfg ? $("#s-token") : $("#s-user")).focus(), 50);
}
async function submitSetup(e) {
  e.preventDefault();
  const user = $("#s-user").value.trim().replace(/^@/, "");
  const token = $("#s-token").value.trim() || cfg?.token;
  if (!user || !token) { $("#s-err").textContent = "Συμπλήρωσε όνομα χρήστη και κωδικό."; return; }
  $("#s-err").textContent = "Έλεγχος…";
  try {
    const h = { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" };
    const me = await fetch("https://api.github.com/user", { cache: "no-store", headers: h });
    if (me.status === 401) { $("#s-err").textContent = "Ο κωδικός δεν αναγνωρίζεται (401). Αντέγραψέ τον ξανά ολόκληρο, ή φτιάξε νέο."; return; }
    const r = await fetch(`https://api.github.com/repos/${user}/${DATA_REPO}`, { cache: "no-store", headers: h });
    if (r.status === 404) { $("#s-err").textContent = `Ο κωδικός είναι σωστός, αλλά δεν βλέπει το «${user}/${DATA_REPO}» (404). Έλεγξε ότι υπάρχει αυτό το repository και ότι το επέλεξες στο Repository access του κωδικού.`; return; }
    if (!r.ok) { $("#s-err").textContent = `Σφάλμα GitHub (${r.status}).`; return; }
    const j = await r.json();
    if (j.permissions && j.permissions.push === false) { $("#s-err").textContent = "Ο κωδικός μπορεί μόνο να διαβάσει. Στο Contents βάλε «Read and write»."; return; }
  } catch (err) { $("#s-err").textContent = "Δεν υπάρχει σύνδεση στο internet."; return; }
  const firstTime = !cfg;
  cfg = { user, token };
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (err) {}
  $("#setup").classList.remove("open");
  if (firstTime) initCloud(); else pull();
  if (firstTime) toast("Καλώς ήρθες!");
}
const state = { cat: "all", status: new Set(), q: "", quick: "all" };
const $ = s => document.querySelector(s);
const catOf = id => CATS.find(c => c.id === id);
const stOf = id => STATUSES.find(s => s.id === id);
const daysTo = iso => Math.round((new Date(iso) - TODAY) / 864e5);
const fmtDate = iso => new Date(iso).toLocaleDateString("el-GR", { day: "numeric", month: "short" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function buildControls() {
  $("#cats").innerHTML = `<button type="button" data-cat="all" aria-pressed="true">Όλα</button>` +
    CATS.map(c => `<button type="button" data-cat="${c.id}" aria-pressed="false"><span class="dot" style="background:${c.color}"></span>${c.name}</button>`).join("");
  $("#status-f").innerHTML = STATUSES.map(s => `<button type="button" class="mini" data-st="${s.id}" aria-pressed="false">${s.name}</button>`).join("");
  $("#f-cat").innerHTML = CATS.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
  $("#f-status").innerHTML = STATUSES.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return projects.filter(p =>
    (state.cat === "all" || p.cat === state.cat) &&
    (!state.status.size || state.status.has(p.status)) &&
    (!q || (p.title + " " + p.sub).toLowerCase().includes(q)) &&
    (state.quick === "all" ||
     (state.quick === "fav" && p.fav) ||
     (state.quick === "done" && p.status === "done") ||
     (state.quick === "late" && p.status !== "done" && daysTo(p.due) < 0) ||
     (state.quick === "today" && p.status !== "done" && daysTo(p.due) >= 0 && daysTo(p.due) <= 7)));
}

function render() {
  document.querySelectorAll("[data-cat]").forEach(b => b.setAttribute("aria-pressed", b.dataset.cat === state.cat));
  document.querySelectorAll("[data-st]").forEach(b => b.setAttribute("aria-pressed", state.status.has(b.dataset.st)));
  document.querySelectorAll("[data-quick]").forEach(b => b.setAttribute("aria-pressed", b.dataset.quick === state.quick));

  const scope = state.cat === "all" ? projects : projects.filter(p => p.cat === state.cat);
  const active = scope.filter(p => p.status !== "done");
  const late = active.filter(p => daysTo(p.due) < 0).length;
  const avg = active.length ? Math.round(active.reduce((a, p) => a + +p.prog, 0) / active.length) : 0;
  $("#title").textContent = state.cat === "all" ? "Τα έργα μου" : catOf(state.cat).name;
  $("#subtitle").textContent = `${active.length} ενεργά · ${scope.length - active.length} ολοκληρωμένα`;
  $("#stats").innerHTML = `<span><b>${avg}%</b>μέση πρόοδος</span><span><b style="color:${late ? "#ff9a9a" : "#fff"}">${late}</b>σε καθυστέρηση</span>`;

  const list = filtered().sort((a, b) => (a.status === "done") - (b.status === "done") || new Date(a.due) - new Date(b.due));
  $("#grid").innerHTML = list.length ? list.map(p => {
    const c = catOf(p.cat), s = stOf(p.status), d = daysTo(p.due);
    const dueTxt = p.status === "done" ? `Ολοκλ. · ${fmtDate(p.due)}` : d < 0 ? `Έληξε πριν ${-d} ημ.` : d === 0 ? "Λήγει σήμερα" : `${fmtDate(p.due)} · σε ${d} ημ.`;
    return `<article class="card" style="--c:${c.color}">
      <div class="hero">
        <svg class="i"><use href="#${c.icon}"/></svg>
        <span class="st"><i style="background:${s.dot}"></i>${s.name}</span>
        <span class="tag">${c.short}</span>
      </div>
      <div class="body">
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.sub || "")}</p>
        <div class="prog"><div class="track"><span style="width:${+p.prog}%"></span></div>${+p.prog}%</div>
      </div>
      <div class="foot">
        <span class="meta ${p.status !== "done" && d < 0 ? "due-late" : ""}">${dueTxt}</span>
        ${p.status !== "done" ? `<button type="button" data-done="${p.id}" aria-label="Σήμανση ως ολοκληρωμένο"><svg class="i"><use href="#i-check-sm"/></svg></button>` : ""}
        <button type="button" data-fav="${p.id}" aria-pressed="${!!p.fav}" aria-label="Αγαπημένο"><svg class="i"><use href="#i-bookmark"/></svg></button>
      </div>
    </article>`;
  }).join("") : `<div class="empty">${mode === "loading" ? "Φόρτωση έργων…" : projects.length ? "Κανένα έργο με αυτά τα φίλτρα." : "Δεν υπάρχουν ακόμη έργα. Πάτα «Νέο έργο» για να ξεκινήσεις."}</div>`;
}

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800); }

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.cat) { state.cat = t.dataset.cat; render(); }
  else if (t.dataset.st) { const s = t.dataset.st; state.status.has(s) ? state.status.delete(s) : state.status.add(s); render(); }
  else if (t.dataset.quick) { state.quick = t.dataset.quick; render(); }
  else if (t.dataset.fav) { const p = projects.find(x => x.id == t.dataset.fav); p.fav = !p.fav; save(); render(); }
  else if (t.dataset.done) { const p = projects.find(x => x.id == t.dataset.done); p.status = "done"; p.prog = 100; save(); render(); toast("Μπράβο, ολοκληρώθηκε!"); }
  else if (t.dataset.view) {
    document.querySelectorAll("[data-view]").forEach(b => b.removeAttribute("aria-current"));
    t.setAttribute("aria-current", "page");
    if (t.dataset.view === "goals") { state.cat = "home"; render(); }
    else if (t.dataset.view === "projects" || t.dataset.view === "home") { state.cat = "all"; state.quick = "all"; render(); }
    else openSetup(false);
  }
});
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#btn-filters").addEventListener("click", () => $("#q").focus());

// Νέο έργο
const scrim = $("#scrim");
$("#add").addEventListener("click", () => { $("#form").reset(); $("#f-due").value = dayOffset(14); if (state.cat !== "all") $("#f-cat").value = state.cat; scrim.classList.add("open"); $("#f-title").focus(); });
$("#cancel").addEventListener("click", () => scrim.classList.remove("open"));
scrim.addEventListener("click", e => { if (e.target === scrim) scrim.classList.remove("open"); });
addEventListener("keydown", e => { if (e.key === "Escape") scrim.classList.remove("open"); });
$("#form").addEventListener("submit", e => {
  e.preventDefault();
  const prog = Math.max(0, Math.min(100, +$("#f-prog").value || 0));
  projects.push({ id: Date.now(), title: $("#f-title").value.trim(), sub: $("#f-sub").value.trim(), cat: $("#f-cat").value, status: $("#f-status").value, prog, due: $("#f-due").value || dayOffset(14), fav: false });
  save(); scrim.classList.remove("open"); render(); toast("Το έργο προστέθηκε");
});

// Δικό σου φόντο
$("#btn-bg").addEventListener("click", e => e.altKey ? $("#bgfile").click() : nextTheme());
$("#bgfile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { $("#bgimg").style.backgroundImage = `url(${r.result})`; try { localStorage.setItem("gd-bg", r.result); } catch (err) { toast("Η φωτογραφία είναι μεγάλη και δεν θα μείνει αποθηκευμένη"); } };
  r.readAsDataURL(f);
});
try { const bg = localStorage.getItem("gd-bg"); if (bg) $("#bgimg").style.backgroundImage = `url(${bg})`; } catch (e) {}

// ===== Ζωγραφισμένο φόντο: βουνά πάνω από λίμνη, σε τρία θέματα =====
const THEMES = {
  sunset: { name: "Ηλιοβασίλεμα", sky: ["#1b2550", "#4a3477", "#a6497a", "#e57f62", "#fbc98e"], sun: "#fff0c8", glow: "255,190,140", haze: "#e39a8c", dark: "#1a1330", stars: 40, lake: "#2a1d3d" },
  night:  { name: "Νύχτα", sky: ["#03050f", "#0a1430", "#1b2a5a", "#33467f", "#5b6ea6"], sun: "#f4f1e6", glow: "170,190,255", haze: "#4a5a92", dark: "#05070f", stars: 260, lake: "#060a1a", moon: true },
  dawn:   { name: "Αυγή", sky: ["#5d86c4", "#8fb2df", "#d7d6e3", "#f4cdb3", "#fde4c9"], sun: "#fffaf0", glow: "255,225,190", haze: "#b9c6dc", dark: "#283449", stars: 0, lake: "#3c4b63" },
};
let themeKey = "sunset";
try { const t = localStorage.getItem("gd-theme"); if (THEMES[t]) themeKey = t; } catch (e) {}
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`; }
function paint() {
  const T = THEMES[themeKey];
  const cv = $("#bg"), dpr = Math.min(devicePixelRatio || 1, 2);
  const W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const horizon = Math.round(H * 0.66);

  // Σκηνή πάνω από τον ορίζοντα σε ξεχωριστό καμβά (για την αντανάκλαση)
  const up = document.createElement("canvas"); up.width = W * dpr; up.height = horizon * dpr;
  const u = up.getContext("2d"); u.scale(dpr, dpr);
  const sky = u.createLinearGradient(0, 0, 0, horizon);
  T.sky.forEach((c, i) => sky.addColorStop(i / (T.sky.length - 1), c));
  u.fillStyle = sky; u.fillRect(0, 0, W, horizon);

  for (let i = 0; i < T.stars; i++) {
    const x = rnd() * W, y = Math.pow(rnd(), 1.6) * horizon * 0.75, r = rnd() * 1.2 + 0.2;
    u.globalAlpha = (1 - y / (horizon * 0.75)) * (0.4 + rnd() * 0.6);
    u.fillStyle = "#fff"; u.beginPath(); u.arc(x, y, r, 0, Math.PI * 2); u.fill();
  }
  u.globalAlpha = 1;

  const sx = W * 0.66, sy = horizon - H * (T.moon ? 0.36 : 0.13), sr = Math.min(W, H) * (T.moon ? 0.035 : 0.055);
  let glow = u.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H) * 0.55);
  glow.addColorStop(0, `rgba(${T.glow},.55)`); glow.addColorStop(0.15, `rgba(${T.glow},.22)`); glow.addColorStop(1, `rgba(${T.glow},0)`);
  u.fillStyle = glow; u.fillRect(0, 0, W, horizon);
  u.shadowColor = T.sun; u.shadowBlur = sr * 1.5; u.fillStyle = T.sun;
  u.beginPath(); u.arc(sx, sy, sr, 0, Math.PI * 2); u.fill(); u.shadowBlur = 0;

  // Οροσειρές με θόρυβο και ατμοσφαιρική προοπτική
  const layers = 6;
  for (let li = 0; li < layers; li++) {
    const t = li / (layers - 1);
    const base = horizon - H * (0.2 - t * 0.17);
    const amp = H * (0.13 - t * 0.07);
    const ph = rnd() * 100, oct = [[1.3, 1], [3.1, 0.45], [7.7, 0.18], [19, 0.06], [41, 0.025]];
    u.beginPath(); u.moveTo(0, horizon);
    for (let x = 0; x <= W; x += 3) {
      const k = x / W * 3 + ph; let h = 0;
      oct.forEach(([f, a], j) => { h += a * (Math.sin(k * f + j * 1.7) * 0.5 + Math.sin(k * f * 1.9 + ph * j) * 0.5); });
      const peak = Math.max(0, h) * 1.25 + h * 0.35;
      u.lineTo(x, base - amp * peak);
    }
    u.lineTo(W, horizon); u.closePath();
    const col = mix(T.haze, T.dark, Math.pow(t, 0.8));
    const mg = u.createLinearGradient(0, base - amp * 1.5, 0, horizon);
    mg.addColorStop(0, col); mg.addColorStop(1, mix(T.haze, T.dark, Math.max(0, Math.pow(t, 0.8) - 0.25)));
    u.fillStyle = mg; u.fill();
    const mist = u.createLinearGradient(0, base - amp * 0.2, 0, horizon);
    mist.addColorStop(0, "rgba(255,255,255,0)"); mist.addColorStop(1, `rgba(${T.glow},${0.12 * (1 - t) + 0.04})`);
    u.fillStyle = mist; u.fillRect(0, base - amp * 0.2, W, horizon - base + amp * 0.2);
  }

  g.drawImage(up, 0, 0, W, horizon);

  // Λίμνη: αντανάκλαση, σκίαση, κυματάκια
  g.save(); g.translate(0, horizon * 2); g.scale(1, -1);
  g.globalAlpha = 0.75; g.filter = "blur(2px)"; g.drawImage(up, 0, 0, W, horizon); g.restore();
  g.filter = "none"; g.globalAlpha = 1;
  const lk = g.createLinearGradient(0, horizon, 0, H);
  lk.addColorStop(0, `rgba(${hex(T.lake).join(",")},.35)`); lk.addColorStop(1, `rgba(${hex(T.lake).join(",")},.92)`);
  g.fillStyle = lk; g.fillRect(0, horizon, W, H - horizon);
  for (let i = 0; i < 140; i++) {
    const y = horizon + Math.pow(rnd(), 1.5) * (H - horizon), w = 20 + rnd() * 160 * (1 + (y - horizon) / (H - horizon));
    const x = Math.abs(rnd() * W - sx) < W * 0.12 ? sx + (rnd() - 0.5) * W * 0.2 : rnd() * W;
    g.fillStyle = `rgba(255,255,255,${0.04 + rnd() * 0.08})`; g.fillRect(x - w / 2, y, w, 1);
  }
  g.fillStyle = `rgba(${T.glow},.35)`; g.fillRect(0, horizon, W, 1);

  // Κόκκος φιλμ και βινιέτα
  const n = document.createElement("canvas"); n.width = n.height = 128;
  const nx = n.getContext("2d"), id = nx.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) { const v = rnd() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 14; }
  nx.putImageData(id, 0, 0);
  g.fillStyle = g.createPattern(n, "repeat"); g.fillRect(0, 0, W, H);
  const v = g.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.85);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(5,3,12,.5)");
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", T.sky[0]);
}
function nextTheme() {
  const keys = Object.keys(THEMES); themeKey = keys[(keys.indexOf(themeKey) + 1) % keys.length];
  try { localStorage.setItem("gd-theme", themeKey); localStorage.removeItem("gd-bg"); } catch (e) {}
  $("#bgimg").style.backgroundImage = ""; paint(); toast(`Φόντο: ${THEMES[themeKey].name}`);
}
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(paint, 120); });

buildControls(); render(); paint(); initCloud();
$("#setup-form").addEventListener("submit", submitSetup);
$("#s-close").addEventListener("click", () => $("#setup").classList.remove("open"));
$("#s-disconnect").addEventListener("click", () => { try { localStorage.removeItem(CFG_KEY); } catch (e) {} try { localStorage.removeItem(CACHE_KEY); } catch (e) {} cfg = null; sha = null; projects = []; render(); lock(true); openSetup(true); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
